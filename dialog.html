<!DOCTYPE html>
<html>
    <head>
        <title>学級日誌</title>
        <style>
            html{
                height:100%;
            }
            body{
                background-image: url('https://picsum.photos/id/885/1920/1080?grayscale&bulr=10');
                background-size: cover;
                background-position: center;
                background-repeat: no-repeat;
  
                /* ★スクロールしても背景画像を画面に固定する */
                background-attachment: fixed;
                min-height: 100vh; /* 古いブラウザ用のバックアップ */
                min-height: 100dvh;
                display:flex;
                flex-direction:column;
            }
            .top-banner {
                position: fixed;
                top: 0;
                left: 0;
                width: 100%;
                height: 60px; /* バナーの高さを指定 */
                z-index: 9999;

                /* ★背景画像の設定 */
                background-color:hsla(0, 0%, 0%, 0.7);

                /* 文字をバナーの真ん中（上下左右）に配置するための設定 */
                display: flex;
                justify-content: left;
                align-items: left;
            }

            .banner-text{
                font-size:40px;
                color:aliceblue;
                margin-left:10px;
            }

            .date{
                width:300px;
                height:100px;
                font-size:20px;
                display: flex;
                gap: 20px;
                align-items: center;
                margin-top:10px;
                margin-bottom:23px;

            }
            .timetable{
                width:700px;
                height:669px;
                font-size:25px;
            }
            /*.timetable th, .timetable j {
                 text-align: left;
            }*/
            tbody {
                border-collapse: separate;
                border-spacing: 0 100px;
            } 
            .midashi{
                font-size:30px;
            }
            .message div{
                font-size:20px;
            }
            .message h2{
                margin-top:25px;
                margin-bottom: 33px;
            }
            caption{
                caption-side: top;    /* テーブルの上に配置（下にするなら bottom） */
                text-align: left;     /* テーブルの左端に寄せる */
                padding-bottom: 0px;  /* テーブルとの隙間をあける */
                font-weight: bold;
                font-size:30px;
            }
            .page-container {
                max-width: 800px;        /* 画面がどれだけ広くても、コンテンツの幅は最大800pxに制限 */
                width: 90%;              /* スマホなどの狭い画面では、画面幅の90%にして左右に程よい余白を作る */
                margin-left: auto;       /* 左側の余白を自動調整 */
                margin-right: auto;      /* 右側の余白を自動調整 */
                padding: 50px;           /* 内側の余白 */
                box-sizing: border-box;

                background-image:linear-gradient(
                    rgb(0, 0, 0) 1px,
                    rgb(225, 225, 225) 1px
                );
                background-size:100% 32px;

                flex-grow:1;

                
            }
            .eshiritori{
                margin-top:33px;
            }
        </style>
        <meta http-equiv="content-type" content="text/html; charset=UTF-8">
    </head>
    <body>
        <div class="top-banner">
            <div class="banner-text">学級日誌</div>
        </div>
        <div class="page-container">
            <div class="date">
                <h2 display=inline-block>日付</h2>
                <div>〇月〇日(曜日)</div>
            </div>
            <div class="schedule">
            <table class="timetable">
            <caption>時間割</caption>
                <!--<thead>
                    <tr>
                        <th>時限</th>
                        <th>教科</th>
                        <th> 内容</th>
                    </tr>
                </thead> !-->
                <tbody>
                    <tr>
                        <th>1限</th>
                        <td>古典探究</td>
                        <td>テスト返却</td>
                    </tr>
                    <tr>
                        <th>2限</th>
                        <td>英コミュ</td>
                        <td>Lesson 4</td>
                    </tr>
                    <tr>
                        <th>3限</th>
                        <td>芸術</td>
                        <td>それぞれ</td>
                    </tr>
                    <tr>
                        <th>4限</th>
                        <td>芸術</td>
                        <td>それぞれ</td>
                    </tr>
                    <tr>
                        <th>5限</th>
                        <td>物理/生物</td>
                        <td>それぞれ</td>
                    </tr>
                    <tr>
                        <th>6限</th>
                        <td>化学</td>
                        <td>テスト返却</td>
                    </tr>
                    <tr>
                        <th>7限</th>
                        <td>数学</td>
                        <td>漸化式</td>
                    </tr>
                </tbody>
            </table>
            </div>
            <div class="message">
                <h2>連絡事項</h2>
                <div>今日は～をした</div>
            </div>
            <div class="eshiritori">
                <h2>絵しりとり</h2>
                <img src ="https://picsum.photos/id/17/300/300"></img>
            </div>
        </div>
    </body>
</html>
