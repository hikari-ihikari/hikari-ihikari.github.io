<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>合格発表</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Noto+Serif+JP:wght@400;700&family=Noto+Sans+JP:wght@400;500&display=swap');
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --crimson: #9B1C1C; --crimson-mid: #DC2626; --crimson-light: #FEF2F2;
    --ink: #1C1917; --ink-light: #57534E; --paper: #FAFAF9;
    --border: #D6D3D1; --border-dark: #A8A29E;
  }
  body { font-family: 'Noto Sans JP', sans-serif; background: var(--paper); color: var(--paper); min-height: 100vh; }
  header { background: var(--paper); color: #fff; text-align: center; padding: 3rem 1rem 2.5rem; }
  header h1 { font-family: 'Noto Serif JP', serif; font-size: 2.4rem; font-weight: 700; letter-spacing: 0.2em; color: #1C1917;}
  @keyframes pulse { 0%,100%{opacity:1}50%{opacity:0.3} }
  .meta-bar { max-width: 720px; margin: 2rem auto 0; padding: 0 1.5rem; display: flex; justify-content: space-between; align-items: flex-end; flex-wrap: wrap; gap: 0.5rem; }
  .meta-left { font-family: 'Noto Serif JP', serif; }
  .round-label { font-size: 0.8rem; color: var(--ink-light); margin-bottom: 0.2rem; }
  .round-title { font-size: 1.4rem; color: var(--ink); }
  .meta-right { font-size: 0.82rem; color: var(--ink-light); text-align: right; }
  .divider { max-width: 720px; margin: 1.2rem auto; border: none; border-top: 1px solid var(--border); }
  .grid-wrap { max-width: 720px; margin: 0 auto; padding: 0 1.5rem 4rem; }
  .number-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(88px, 1fr)); gap: 10px; }
  .number-cell {
    background: #fff; border: 1px solid var(--border); border-radius: 4px;
    padding: 0.8rem 0.5rem; text-align: center;
    font-family: 'Noto Serif JP', serif; font-size: 1.15rem; color: var(--ink);
    opacity: 0; transform: translateY(6px); animation: fadeUp 0.3s ease forwards;
    transition: border-color 0.2s, color 0.2s;
  }
  .number-cell:hover { border-color: var(--crimson); color: var(--crimson); }
  @keyframes fadeUp { to { opacity:1; transform:translateY(0); } }
  .empty-state { text-align: center; padding: 5rem 1rem; color: var(--ink-light); }
  .empty-state .icon { font-size: 2.5rem; margin-bottom: 1rem; }
  .empty-state p { font-size: 0.9rem; line-height: 1.8; }
  .loading { text-align: center; padding: 4rem 1rem; color: var(--ink-light); font-size: 0.9rem; }
  footer { text-align: center; padding: 1.5rem; font-size: 0.75rem; color: var(--border-dark); border-top: 1px solid var(--border); }
  /* 下 */
.bottom {
  position: absolute;
  inset: 0;
  background: #4a90e2;
  color: white;
  display: flex;
  align-items: center;
  justify-content: center;
  z-index: 0;
}

/* スライス共通 */
.slice {
  position: absolute;
  width: 100%;
  height: 55%;            /* ← 少し大きめにする（隙間対策） */
  left: 0;
  transform-origin: top;
  transform-style: preserve-3d;
}

/* 親子構造 */
.slice1 { top: 0;    z-index: 3; }
.slice2 { top: 100%; z-index: 2; }
.slice3 { top: 100%; z-index: 1; }

/* 面 */
.face {
  position: absolute;
  inset: 0;
  backface-visibility: hidden;
  display: flex;
  align-items: center;
  justify-content: center;
  border: none;
}

/* 表 */
.front {
  background: white;
}

/* 裏 */
.back {
  background: #dcdcdc;
  transform: rotateX(180deg);
}

/* ===== アニメーション ===== */

/* 上 */
.card.open.slice1 {
  transform: rotateX(120deg);
  transition: 6s cubic-bezier(0.2,0.8,0.2,1);
}

/* 中 */
.card.open.slice2 {
  transform: rotateX(120deg);
  transition: 8s cubic-bezier(0.2,0.8,0.2,1);
}

/* 下 */
.card.open.slice3 {
  transform: rotateX(140deg) scaleY(0.85);
  transition: 6s cubic-bezier(0.2,0.8,0.2,1);
}

.touch-layer{
  position:absolute;
  inset: 0;
  z-index: 100;
}
</style>
</head>
<body>
<div class="card" ,id="card">
<header>
  <h1>合　格　発　表</h1>
</header>

<div id="app"><div class="loading">読み込み中...</div></div>

<footer>リアルタイム同期中 &mdash; 自動更新されます</footer>
<div class="touch-layer"></div>
  <div class="slice slice1">
    <div class="face front"> </div>
    <div class="face back"> </div>

    <div class="slice slice2">
      <div class="face front"> </div>
      <div class="face back"> </div>

      <div class="slice slice3">
        <div class="face front"> </div>
        <div class="face back"> </div>
      </div>
  </div>
</div>
<script>
const SUPABASE_URL = 'https://lqzleairwoupzdbkhwtj.supabase.co';
const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImxxemxlYWlyd291cHpkYmtod3RqIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODEwMzExNzgsImV4cCI6MjA5NjYwNzE3OH0.WchooBAaiXhjcHtE54sQLBmDddiz730ySYlwgdlhlMI';
const TABLE = 'lottery_results';
const hdrs = { 'apikey': SUPABASE_KEY, 'Authorization': `Bearer ${SUPABASE_KEY}` };
let currentRound = null;

async function fetchLatest() {
  const res = await fetch(`${SUPABASE_URL}/rest/v1/${TABLE}?select=*&order=round.desc&limit=1`, { headers: hdrs });
  if (!res.ok) throw new Error(await res.text());
  const data = await res.json();
  return data.length > 0 ? data[0] : null;
}

function render(data) {
  const app = document.getElementById('app');
  if (!data) {
    app.innerHTML = `<div class="empty-state"><div class="icon">📄</div><p>まだ合格発表が行われていません。<br>しばらくお待ちください。</p></div>`;
    return;
  }
  const d = new Date(data.created_at);
  const fmt = `${d.getFullYear()}年${d.getMonth()+1}月${d.getDate()}日 ${d.getHours()}:${String(d.getMinutes()).padStart(2,'0')}`;

  const cells = data.winners.map((num, i) =>
    `<div class="number-cell" style="animation-delay:${i*28}ms">${String(num).padStart(4,'0')}</div>`
  ).join('');

  app.innerHTML = `
    <div class="meta-bar">
      <div class="meta-left">
        <div class="round-label">第 ${data.round} 回抽選</div>
        <div class="round-title">合格者数：${data.winner_count} 名</div>
      </div>
      <div class="meta-right">発表日時：${fmt}</div>
    </div>
    <hr class="divider">
    <div class="grid-wrap"><div class="number-grid">${cells}</div></div>`;
  currentRound = data.round;
}

async function init() {
  try { render(await fetchLatest()); }
  catch(e) { document.getElementById('app').innerHTML = `<div class="empty-state"><p>読み込みに失敗しました。<br>${e.message}</p></div>`; }
}

function connectRealtime() {
  const ws = new WebSocket(`wss://lqzleairwoupzdbkhwtj.supabase.co/realtime/v1/websocket?apikey=${SUPABASE_KEY}&vsn=1.0.0`);
  ws.onopen = () => ws.send(JSON.stringify({
    topic: `realtime:public:${TABLE}`, event: 'phx_join',
    payload: { config: { postgres_changes: [{ event: '*', schema: 'public', table: TABLE }] } }, ref: '1'
  }));
  ws.onmessage = async (e) => {
    const msg = JSON.parse(e.data);
    if (msg.event === 'postgres_changes' || msg.payload?.data?.type) {
      const data = await fetchLatest();
      if (data && data.round !== currentRound) render(data);
    }
  };
  ws.onclose = () => setTimeout(connectRealtime, 3000);
  ws.onerror = () => ws.close();
}

init();
connectRealtime();
setInterval(async () => {
  try { const data = await fetchLatest(); if (data && data.round !== currentRound) render(data); } catch {}
}, 30000);

const layer = document.querySelector(".touch-layer");

layer.addEventListener("pointerdown", () => {
  document.querySelector(".card").classList.add("open");
});
</script>
</body>
</html>
