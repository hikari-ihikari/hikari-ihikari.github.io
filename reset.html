<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>リセット</title>
</head>
<body>
<h1>抽選データ リセット</h1>
<p id="status">読み込み中...</p>
<button id="btnAll" onclick="resetAll()">全データ削除</button>
<button id="btnLatest" onclick="resetLatest()">最新1件削除</button>
<pre id="log"></pre>

<script>
const SUPABASE_URL = 'https://lqzleairwoupzdbkhwtj.supabase.co';
const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImxxemxlYWlyd291cHpkYmtod3RqIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODEwMzExNzgsImV4cCI6MjA5NjYwNzE3OH0.WchooBAaiXhjcHtE54sQLBmDddiz730ySYlwgdlhlMI';
const TABLE = 'lottery_results';
const hdrs = { 'apikey': SUPABASE_KEY, 'Authorization': `Bearer ${SUPABASE_KEY}` };

function log(msg) {
  document.getElementById('log').textContent += msg + '\n';
}

async function fetchAll() {
  const res = await fetch(`${SUPABASE_URL}/rest/v1/${TABLE}?select=id,round&order=id.asc`, { headers: hdrs });
  log('GET status: ' + res.status);
  const data = await res.json();
  log('取得件数: ' + data.length);
  log(JSON.stringify(data));
  return data;
}

async function deleteById(id) {
  const url = `${SUPABASE_URL}/rest/v1/${TABLE}?id=eq.${id}`;
  log('DELETE: ' + url);
  const res = await fetch(url, { method: 'DELETE', headers: hdrs });
  log('DELETE status: ' + res.status);
  const text = await res.text();
  log('response: ' + text);
  return res.ok;
}

async function resetAll() {
  document.getElementById('log').textContent = '';
  log('=== 全削除開始 ===');
  const data = await fetchAll();
  if (data.length === 0) { log('削除対象なし'); return; }
  for (const row of data) {
    await deleteById(row.id);
  }
  log('=== 完了 ===');
  await fetchAll();
}

async function resetLatest() {
  document.getElementById('log').textContent = '';
  log('=== 最新1件削除 ===');
  const res = await fetch(`${SUPABASE_URL}/rest/v1/${TABLE}?select=id,round&order=round.desc&limit=1`, { headers: hdrs });
  const data = await res.json();
  log(JSON.stringify(data));
  if (data.length === 0) { log('削除対象なし'); return; }
  await deleteById(data[0].id);
  log('=== 完了 ===');
}

// 起動時に現在のデータを表示
fetchAll().then(() => document.getElementById('status').textContent = '準備完了');
</script>
</body>
</html>
