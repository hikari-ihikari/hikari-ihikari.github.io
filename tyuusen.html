<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>ベロン捲り</title>
<style>
body {
  background: #eee;
  display: flex;
  justify-content: center;
  align-items: center;
  height: 100vh;
  font-family: sans-serif;
}

.card {
  position: relative;
  width: 260px;
  height: 160px;
  perspective: 1400px; /* 奥行き強化 */
  cursor: pointer;
}

.bottom {
  position: absolute;
  width: 100%;
  height: 100%;
  background: #4a90e2;
  color: white;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 20px;
}

/* 上に軸 */
.page {
  position: absolute;
  width: 100%;
  height: 100%;
  background: white;
  transform-origin: top center; /* ←ここ重要 */
  transform-style: preserve-3d;
  transition: transform 0.9s cubic-bezier(0.2, 0.8, 0.2, 1);
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 20px;
  box-shadow: 0 10px 20px rgba(0,0,0,0.2);
}

/* 曲がり感（影） */
.page::before {
  content: "";
  position: absolute;
  inset: 0;
  background: linear-gradient(to bottom, rgba(0,0,0,0.35), transparent 60%);
  opacity: 0;
  transition: opacity 0.4s;
}

/* ベロン */
.card:hover .page {
  transform: rotateX(-140deg) scaleY(0.65); /* ←ここがキモ */
}

/* 影ON */
.card:hover .page::before {
  opacity: 1;
}
</style>
</head>
<body>

<div class="card">
  <div class="bottom">現れたテキスト</div>
  <div class="page">めくって！</div>
</div>

</body>
</html>
