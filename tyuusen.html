<!DOCTYPE html>
<html>
<head>
<meta http-equiv="content-type" content="text/html; charset=UTF-8">
<style>
.book {
  perspective: 1000px;
  width: 200px;
  height: 300px;
}

.page {
  width: 100%;
  height: 100%;
  position: relative;
  transform-style: preserve-3d;
  transform-origin: top center; /* 上からめくる */
  transition: transform 1s;
}

/* ホバーでめくる */
.book:hover .page {
  transform: rotateX(-180deg);
}

.front, .back {
  position: absolute;
  width: 100%;
  height: 100%;
  display: flex;
  align-items: center;
  justify-content: center;
  backface-visibility: hidden;
  font-size: 24px;
}

.front {
  background: white;
  border: 1px solid #ccc;
}

.back {
  background: #f0f0f0;
  transform: rotateX(180deg);
}
</style>
</head>
<body>
<div class="book">
  <div class="page">
    <div class="front">表</div>
    <div class="back">裏</div>
  </div>
</div>
</body>
</html>
