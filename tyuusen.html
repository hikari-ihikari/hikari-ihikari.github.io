<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>連動する紙</title>
<style>
body {
  background: #eee;
  display: flex;
  justify-content: center;
  align-items: center;
  height: 100vh;
}

/* コンテナ */
.card {
  width: 260px;
  height: 180px;
  perspective: 1600px;
  position: relative;
}

/* 下 */
.bottom {
  position: absolute;
  inset: 0;
  background: #4a90e2;
  color: white;
  display: flex;
  justify-content: center;
  align-items: center;
}

/* ===== ここが重要 ===== */

/* 一番上 */
.slice1, .slice2, .slice3 {
  position: absolute;
  width: 100%;
  height: 33.33%;
  transform-origin: top;
  transform-style: preserve-3d;
}

/* 親子構造 */
.slice1 { top: 0; }
.slice2 { top: 100%; }  /* ←親の下にぶら下がる */
.slice3 { top: 100%; }

/* 表裏 */
.front, .back {
  position: absolute;
  inset: 0;
  backface-visibility: hidden;
  display: flex;
  justify-content: center;
  align-items: center;
}

.front {
  background: white;
  border: 1px solid #ccc;
}

.back {
  background: #f4f4f4;
  transform: rotateX(180deg);
}

/* アニメーション（連鎖） */
.card:hover .slice1 {
  transform: rotateX(-60deg);
  transition: 0.3s;
}

.card:hover .slice2 {
  transform: rotateX(-80deg);
  transition: 0.4s;
}

.card:hover .slice3 {
  transform: rotateX(-120deg);
  transition: 0.5s;
}
</style>
</head>
<body>

<div class="card">
  <div class="bottom">中身</div>

  <div class="slice1">
    <div class="front">上</div>
    <div class="back">裏</div>

    <div class="slice2">
      <div class="front">中</div>
      <div class="back">裏</div>

      <div class="slice3">
        <div class="front">下</div>
        <div class="back">裏</div>
      </div>

    </div>
  </div>

</div>

</body>
</html>
