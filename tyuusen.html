<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>本物風 曲がるめくり</title>
<style>
body {
  background: #eee;
  display: flex;
  justify-content: center;
  align-items: center;
  height: 100vh;
  font-family: sans-serif;
}

.card {
  width: 260px;
  height: 180px;
  perspective: 1600px;
  position: relative;
  cursor: pointer;
}

/* 下の内容 */
.bottom {
  position: absolute;
  inset: 0;
  background: #4a90e2;
  color: white;
  display: flex;
  align-items: center;
  justify-content: center;
}

/* ページ */
.page {
  position: absolute;
  inset: 0;
  transform-style: preserve-3d;
}

/* 分割共通 */
.slice {
  position: absolute;
  left: 0;
  width: 100%;
  height: 33.33%;
  transform-origin: top center;
  transform-style: preserve-3d;
}

/* 各位置 */
.slice:nth-child(1) { top: 0; }
.slice:nth-child(2) { top: 33.33%; }
.slice:nth-child(3) { top: 66.66%; }

/* 表裏 */
.front,
.back {
  position: absolute;
  inset: 0;
  display: flex;
  justify-content: center;
  align-items: center;
  backface-visibility: hidden;
  font-size: 18px;
}

.front {
  background: white;
  border: 1px solid #ccc;
}

.back {
  background: #f4f4f4;
  transform: rotateX(180deg);
}

/* ==== アニメーション ==== */

/* 上（ほぼ硬い） */
.card:hover .slice:nth-child(1) {
  transform: rotateX(-60deg);
  transition: 0.4s cubic-bezier(0.2,0.8,0.2,1);
}

/* 中（しなる） */
.card:hover .slice:nth-child(2) {
  transform: rotateX(-110deg);
  transition: 0.5s cubic-bezier(0.2,0.8,0.2,1);
}

/* 下（ベロン） */
.card:hover .slice:nth-child(3) {
  transform: rotateX(-150deg) scaleY(0.8);
  transition: 0.6s cubic-bezier(0.2,0.8,0.2,1);
}

/* 影（カーブ感アップ） */
.slice::after {
  content: "";
  position: absolute;
  inset: 0;
  background: linear-gradient(to bottom, rgba(0,0,0,0.3), transparent);
  opacity: 0;
  transition: 0.3s;
}

.card:hover .slice::after {
  opacity: 1;
}
</style>
</head>
<body>

<div class="card">
  <div class="bottom">中のテキスト</div>

  <div class="page">

    <div class="slice">
      <div class="front">め</div>
      <div class="back">裏1</div>
    </div>

    <div class="slice">
      <div class="front">く</div>
      <div class="back">裏2</div>
    </div>

    <div class="slice">
      <div class="front">る</div>
      <div class="back">裏3</div>
    </div>

  </div>
</div>

</body>
</html>
