<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<style>
body {
  background: #eee;
  display: flex;
  justify-content: center;
  align-items: center;
  height: 100vh;
  font-family: sans-serif;
}

.container {
  width: 260px;
  height: 180px;
  position: relative;
  cursor: pointer;
}

/* 奥のテキスト */
.bottom {
  position: absolute;
  inset: 0;
  background: #4a90e2;
  color: white;
  display: flex;
  align-items: center;
  justify-content: center;
}

/* SVG */
svg {
  position: absolute;
  inset: 0;
}

/* 紙 */
path {
  fill: white;
  stroke: #ccc;
  transition: d 0.5s cubic-bezier(0.2,0.8,0.2,1);
}
</style>
</head>
<body>

<div class="container">
  <div class="bottom">中のテキスト</div>

  <svg viewBox="0 0 260 180">
    <path id="page"
      d="
      M0,0 
      L260,0 
      L260,180 
      Q130,180 0,180 
      Z"
    />
  </svg>
</div>

<script>
const container = document.querySelector(".container");
const page = document.getElementById("page");

container.addEventListener("mouseenter", () => {
  page.setAttribute("d", `
    M0,0 
    L260,0 
    L260,60 
    Q130,140 0,60 
    Z
  `);
});

container.addEventListener("mouseleave", () => {
  page.setAttribute("d", `
    M0,0 
    L260,0 
    L260,180 
    Q130,180 0,180 
    Z
  `);
});
</script>

</body>
</html>
