<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>垂れる紙めくり</title>
<style>
body {
  background: #eee;
  display: flex;
  justify-content: center;
  align-items: center;
  height: 100vh;
  font-family: sans-serif;
}

.card {
  position: relative;
  width: 260px;
  height: 160px;
  perspective: 1400px;
  cursor: pointer;
}

/* 下にある内容 */
.bottom {
  position: absolute;
  inset: 0;
  background: #4a90e2;
  color: white;
  display: flex;
  align-items: center;
  justify-content: center;
}

/* ページ */
.page {
  position: absolute;
  inset: 0;
  transform-style: preserve-3d;
  transform-origin: top center;
  transition: transform 3.0s cubic-bezier(0.2, 0.8, 0.2, 1);
}

/* 表 */
.front,
.back {
  position: absolute;
  inset: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 20px;
  backface-visibility: hidden;
}

/* 表 */
.front {
  background: #fff;
  border: 1px solid #ccc;
  z-index: 2;
}

/* 裏 */
.back {
  background: #f4f4f4;
  transform: rotateX(180deg);
}

/* 垂れ部分（これがキモ） */
.page::after {
  content: "";
  position: absolute;
  left: 0;
  bottom: 0;
  width: 100%;
  height: 60%;
  background: linear-gradient(to top, rgba(0,0,0,0.25), transparent);
  transform-origin: top;
  transition: transform 0.5s cubic-bezier(0.2, 0.8, 0.2, 1);
  opacity: 0;
}

/* めくり */
.card:hover .page {
  transform: rotateX(-140deg);
}

/* 垂れる動き */
.card:hover .page::after {
  transform: scaleY(1.4) translateY(10px); /* ← 垂れ演出 */
  opacity: 1;
}
</style>
</head>
<body>

<div class="card">
  <div class="bottom">中のテキスト</div>

  <div class="page">
    <div class="front">めくって</div>
    <div class="back">裏側だよ</div>
  </div>

</div>

</body>
</html>
