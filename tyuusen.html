<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>縦めくり（曲がる風）</title>
<style>
body {
  background: #eee;
  display: flex;
  justify-content: center;
  align-items: center;
  height: 100vh;
  font-family: sans-serif;
}

/* コンテナ */
.card {
  position: relative;
  width: 260px;
  height: 160px;
  perspective: 1200px;
  cursor: pointer;
}

/* 下側（めくった後に出る） */
.bottom {
  position: absolute;
  width: 100%;
  height: 100%;
  background: #4a90e2;
  color: white;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 20px;
}

/* めくる紙 */
.page {
  position: absolute;
  width: 100%;
  height: 100%;
  background: white;
  transform-origin: bottom center;
  transform-style: preserve-3d;
  transition: transform 0.8s cubic-bezier(0.65, 0, 0.35, 1);
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 20px;
}

/* 曲がり演出（影） */
.page::before {
  content: "";
  position: absolute;
  width: 100%;
  height: 100%;
  background: linear-gradient(to top, rgba(0,0,0,0.25), transparent);
  opacity: 0;
  transition: opacity 0.5s;
}

/* めくり時 */
.card:hover .page {
  transform: rotateX(160deg) scaleY(0.85);
}

/* めくり時に影表示 */
.card:hover .page::before {
  opacity: 1;
}
</style>
</head>
<body>

<div class="card">
  <div class="bottom">出てきたテキスト</div>
  <div class="page">めくってね</div>
</div>

</body>
</html>
