<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<style>
body {
  background: #eee;
  display: flex;
  justify-content: center;
  align-items: center;
  height: 100vh;
}

.card {
  width: 260px;
  height: 180px;
  perspective: 1800px;
  position: relative;
  overflow: hidden; /* ←はみ出し防止（重要） */
}

/* 下 */
.bottom {
  position: absolute;
  inset: 0;
  background: #4a90e2;
  color: white;
  display: flex;
  align-items: center;
  justify-content: center;
  z-index: 0;
}

/* スライス共通 */
.slice {
  position: absolute;
  width: 100%;
  height: 55%;            /* ← 少し大きめにする（隙間対策） */
  left: 0;
  transform-origin: top;
  transform-style: preserve-3d;
}

/* 親子構造 */
.slice1 { top: 0;    z-index: 3; }
.slice2 { top: 100%; z-index: 2; }
.slice3 { top: 100%; z-index: 1; }

/* 面 */
.face {
  position: absolute;
  inset: 0;
  backface-visibility: hidden;
  display: flex;
  align-items: center;
  justify-content: center;
}

/* 表 */
.front {
  background: white;
  border: 1px solid #ccc;
}

/* 裏 */
.back {
  background: #f4f4f4;
  transform: rotateX(180deg);
}

/* ===== アニメーション ===== */

/* 上 */
.card:hover .slice1 {
  transform: rotateX(-120deg);
  transition: 4s cubic-bezier(0.2,0.8,0.2,1);
}

/* 中 */
.card:hover .slice2 {
  transform: rotateX(-120deg);
  transition: 4s cubic-bezier(0.2,0.8,0.2,1);
}

/* 下 */
.card:hover .slice3 {
  transform: rotateX(-140deg) scaleY(0.85);
  transition: 4s cubic-bezier(0.2,0.8,0.2,1);
}
</style>
</head>
<body>

<div class="card">
  <div class="bottom">中のテキスト</div>

  <div class="slice slice1">
    <div class="face front">上</div>
    <div class="face back">裏</div>

    <div class="slice slice2">
      <div class="face front">中</div>
      <div class="face back">裏</div>

      <div class="slice slice3">
        <div class="face front">下</div>
        <div class="face back">裏</div>
      </div>

    </div>
  </div>

</div>

</body>
</html>
